<footer class="main-footer">
  <div class="main-footer__content">
    <p class="main-footer__badge">See you in InsertCity!</p>
    <p class="main-footer__copy">meet.js &copy; {{ year }}</p>
    <p class="main-footer__editions">
      <strong>Previous editions:</strong>
      {{#each previousEditions}}
      <a href="https://summit.meetjs.pl/{{ this }}/">{{ this }}</a>{{#unless @last}},{{/unless}}
      {{/each}}
    </p>
  </div>
</footer>
